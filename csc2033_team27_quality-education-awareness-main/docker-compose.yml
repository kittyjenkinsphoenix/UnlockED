services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unlocked
      POSTGRES_USER: unlocked
      POSTGRES_PASSWORD: unlocked
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unlocked -d unlocked"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 run:app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://unlocked:unlocked@db:5432/unlocked
      FLASK_ENV: development
    ports:
      - "5000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: