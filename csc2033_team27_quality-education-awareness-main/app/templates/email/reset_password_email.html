<table style="background-color:white; border:30px solid rgb(64,143,148); border-spacing:20px; font-family:Arial; width:100%">
    <tr>
        <td style="text-align:center">
            <h1>UnlockED</h1><br>
            <h2>Reset your password</h2>
            <p>Hello {{ user.name }},</p>
            <p>We received a request to reset your password.</p>
            <p>
                <a href="{{ url_for('main.reset_password', token=token, _external=True) }}">Reset your password</a>
            </p>
            <p>If you did not request this change, you can ignore this email.</p>
            <br>
        </td>
    </tr>
</table>
